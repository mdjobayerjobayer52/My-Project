<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>কর্মচারী নিয়োগ আবেদন ফর্ম</h2>
    
    <div id="successMsg" class="success-message">
        আপনার আবেদনটি সফলভাবে জমা হয়েছে! ধন্যবাদ।
    </div>

    <!-- action="submit.php" ব্যাকএন্ড ফাইলে ডাটা পাঠাবে -->
    <form id="https://formspree.io/f/mjgndaoz" action="https://formspree.io/f/mjgndaoz" method="POST">
        
        <!-- Full Name -->
        <div class="form-group">
            <label for="fullname">পূর্ণ নাম (Full Name) *</label>
            <input type="text" id="fullname" name="fullname" required placeholder="আপনার নাম লিখুন">
        </div>

        <!-- Phone & Email -->
        <div class="form-row">
            <div class="form-group">
                <label for="phone">মোবাইল নম্বর *</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required 
                    placeholder="017XXXXXXXX" 
                    minlength="11" 
                    maxlength="11" 
                    pattern="[0-9]{11}" 
                    title="ঠিক ১১ ডিজিটের মোবাইল নম্বর দিন"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                >
                <small id="phoneError" style="color: red; display: none;">সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 017XXXXXXXX)</small>
            </div>
            <div class="form-group">
                <label for="email">ইমেইল অ্যাড্রেস</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </div>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">বর্তমান ঠিকানা *</label>
            <textarea id="address" name="address" rows="2" required placeholder="আপনার ঠিকানা লিখুন"></textarea>
        </div>

        <!-- Position & Experience -->
        <div class="form-row">
            <div class="form-group">
                <label for="position">আবেদনকৃত পদ *</label>
                <select id="position" name="position" required>
                    <option value="">পদ নির্বাচন করুন</option>
                    <option value="Sales Executive">সেলস এক্সিকিউটিভ</option>
                    
                </select>
            </div>
            <div class="form-group">
                <label for="experience">অভিজ্ঞতা</label>
                <select id="experience" name="experience">
                    <option value="Fresh Graduate">কোনো অভিজ্ঞতা নেই (Fresher)</option>
                    <option value="1-2 Years">১ - ২ বছর</option>
                    <option value="3+ Years">৩ বছরের বেশি</option>
                </select>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">আবেদন জমা দিন</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
